<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title data-i18n="brand">갈피</title>
        <script src="js/theme.js?v=20261123-ui5"></script>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css">
        <link rel="stylesheet" href="style.css?v=20261123-ui5">
        <script src="js/state.js?v=20261123-ui5" defer></script>
        <script src="js/i18n.js?v=20261123-ui5" defer></script>
        <script src="js/transcript.js?v=20261123-ui5" defer></script>
        <script src="js/selection-context.js?v=20261123-ui5" defer></script>
        <script src="js/storage.js?v=20261123-ui5" defer></script>
        <script src="js/explanations.js?v=20261123-ui5" defer></script>
        <script src="js/pages.js?v=20261123-ui5" defer></script>
        <script src="js/controls.js?v=20261123-ui5" defer></script>
        <script src="js/correction.js?v=20261123-ui5" defer></script>
        <script src="js/speech-recognition.js?v=20261123-ui5" defer></script>
        <script src="js/selection.js?v=20261123-ui5" defer></script>
        <script src="js/content-tabs.js?v=20261123-ui5" defer></script>
        <script src="js/interface.js?v=20261123-ui5" defer></script>
        <script src="script.js?v=20261123-ui5" defer></script>
    </head>
    <body>
        <div class="mobile-bar"><button id="menu-toggle" type="button" aria-controls="page-sidebar" aria-expanded="false" data-i18n-aria="pageMenu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span data-i18n="brand">갈피</span></div>
        <button id="drawer-backdrop" type="button" tabindex="-1" data-i18n-aria="closeMenu" hidden></button>
        <nav id="page-sidebar" class="sidebar" aria-label="페이지 메뉴" data-i18n-aria="pageMenu">
            <button id="menu-close" type="button" data-i18n-aria="closeMenu">×</button><div class="workspace-brand"><span class="workspace-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12v17l-6-4-6 4V4Z"/></svg></span><span data-i18n="brand">갈피</span></div>
            <button class="new-page" type="button">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7"/>
                    <path d="m16 3 5 5M10 14l1-5 7-7 5 5-7 7-6 1Z"/>
                </svg>
                <span data-i18n="newPage">새 페이지</span>
            </button>
            <div id="page-list" data-i18n-aria="pageList" aria-label="&#54168;&#51060;&#51648; &#47785;&#47197;"></div>
        </nav>
        <main>
            <header class="page-header">
                <svg class="page-icon" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4H5v16h14v-8M10 14l1-4 7-7 3 3-7 7-4 1Z"/></svg>
                <div class="title-row">
                    <input class="page-title" type="text" maxlength="200" placeholder="제목을 입력하세요" data-i18n-placeholder="titlePlaceholder" aria-label="페이지 제목" data-i18n-aria="pageTitle" autocomplete="off">
                </div>
            </header>
            <div class="toolbar" role="group" aria-label="음성 인식 도구" data-i18n-aria="speechTools">
                <button id="start" type="button" aria-pressed="false">
                    <span class="audio-wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                    <span id="status" role="status">받아쓰기 시작</span>
                </button>
                <button id="clear" disabled data-i18n="clear">초기화</button>
                <button id="edit-transcript" data-i18n="editTranscript" type="button" aria-pressed="false">&#50896;&#47928; &#49688;&#51221;</button>
                <details class="settings-menu">
                    <summary class="settings-toggle" aria-label="설정" data-i18n-aria="settings" title="설정" data-i18n-title="settings">
                        <svg width="21" height="21" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true">
                            <path d="M4 10H16M23 10H28M4 23H9M16 23H28"/>
                            <circle cx="19.5" cy="10" r="3.5"/>
                            <circle cx="12.5" cy="23" r="3.5"/>
                        </svg>
                    </summary>
                    <div class="language-settings" role="group" aria-label="설정" data-i18n-aria="settings">
                <p class="settings-heading" data-i18n="languageSettings">언어 설정</p>
                <label class="language-field" for="inputLanguage">
                    <span data-i18n="inputLanguage">입력 언어</span>
                    <select id="inputLanguage">
                        <option value="ko-KR">한국어</option>
                        <option value="en-US">English</option>
                        <option value="ja-JP">日本語</option>
                        <option value="zh-CN">中文</option>
                        <option value="vi-VN">Tiếng Việt</option>
                        <option value="es-ES">Español</option>
                        <option value="fr-FR">Français</option>
                        <option value="de-DE">Deutsch</option>
                    </select>
                </label>
                <label class="language-field" for="userLanguage">
                    <span data-i18n="userLanguage">사용자 언어</span>
                    <select id="userLanguage">
                        <option value="ko-KR">한국어</option>
                        <option value="en-US">English</option>
                        <option value="ja-JP">日本語</option>
                        <option value="zh-CN">中文</option>
                        <option value="vi-VN">Tiếng Việt</option>
                        <option value="es-ES">Español</option>
                        <option value="fr-FR">Français</option>
                        <option value="de-DE">Deutsch</option>
                    </select>
                </label>
                <div class="settings-options">
                    <label class="setting-switch" for="dark-mode">
                        <span class="setting-label" data-i18n="darkMode">&#45796;&#53356; &#47784;&#46300;</span>
                        <input id="dark-mode" type="checkbox" role="switch">
                        <span class="switch-track" aria-hidden="true"></span>
                    </label>
                    <div class="setting-option">
                        <label class="setting-switch" for="sentence-correction">
                            <span class="setting-label" data-i18n="sentenceCorrection">발언 문맥 자동 다듬기</span>
                            <input id="sentence-correction" type="checkbox" role="switch" aria-describedby="correction-help" checked>
                            <span class="switch-track" aria-hidden="true"></span>
                        </label>
                        <small id="correction-help" class="correction-help" data-i18n="sentenceCorrectionHelp">문맥에 맞게 발언을 다듬습니다. 원문은 완료될 때까지 유지됩니다.</small>
                    </div>
                </div>
            </div>
                </details>
            </div>
            <div class="content-tabs">
                <div class="content-tab-list" role="tablist" aria-label="페이지 내용" data-i18n-aria="pageContent">
                <button class="transcript-heading" id="transcript-tab" type="button" role="tab" aria-selected="true" aria-controls="transcript" data-i18n="transcript">스크립트</button>
                <button class="transcript-heading summary-heading" id="summary-tab" disabled data-i18n="summary" type="button" role="tab" aria-selected="false" aria-controls="page-summary" tabindex="-1">요약</button>
                </div>
                <button id="copy-content" type="button" disabled data-i18n-aria="copyAll" data-i18n-title="copyAll" aria-label="전체 복사" title="전체 복사">
                    <svg class="copy-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></svg>
                    <svg class="copy-check" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>
                </button>
                <span id="copy-feedback" class="copy-feedback" role="status" aria-live="polite"></span>
            </div>
            <p id="correction-pending" class="correction-pending" role="status" hidden></p>
            <div id="transcript" role="tabpanel" aria-labelledby="transcript-tab">
                <div id="final"></div>
                <div id="interim" aria-live="polite"></div>
            </div>
            <div id="page-summary" role="tabpanel" aria-labelledby="summary-tab" hidden></div>
        </main>
        <aside class="explanation" id="explanation" aria-label="선택한 텍스트 설명" data-i18n-aria="explanation" hidden>
            <div class="explanation-header">
                <p id="selectedTerm"></p>
                <button id="deleteExplanation" type="button" data-i18n="deleteCard">카드 삭제</button>
            </div>
            <div id="response" aria-live="polite" aria-atomic="true"></div>
        </aside>
    </body>
</html>
