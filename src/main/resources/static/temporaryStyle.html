<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title data-i18n="brand">갈피</title>
        <link rel="stylesheet" href="style.css">
        <script src="js/state.js" defer></script>
        <script src="js/i18n.js" defer></script>
        <script src="js/transcript.js" defer></script>
        <script src="js/selection-context.js" defer></script>
        <script src="js/storage.js" defer></script>
        <script src="js/explanations.js" defer></script>
        <script src="js/controls.js" defer></script>
        <script src="js/speech-recognition.js" defer></script>
        <script src="js/selection.js" defer></script>
        <script src="script.js" defer></script>
    </head>
    <body>
        <nav class="sidebar" aria-label="페이지 메뉴">
            <button class="new-page" type="button">
                <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-7"/>
                    <path d="m16 3 5 5M10 14l1-5 7-7 5 5-7 7-6 1Z"/>
                </svg>
                <span>새 페이지</span>
            </button>
        </nav>
        <main>
            <header class="page-header">
                <span class="page-icon" aria-hidden="true">📄</span>
                <div class="title-row">
                    <input class="page-title" type="text" placeholder="제목을 입력하세요" aria-label="페이지 제목" autocomplete="off">
                </div>
            </header>
            <div class="language-settings" role="group" aria-label="언어 설정" data-i18n-aria="languageSettings">
                <label class="language-field" for="inputLanguage">
                    <span data-i18n="inputLanguage">입력 언어</span>
                    <select id="inputLanguage">
                        <option value="ko-KR">한국어</option>
                        <option value="en-US">English</option>
                        <option value="ja-JP">日本語</option>
                        <option value="zh-CN">中文</option>
                        <option value="vi-VN">Tiếng Việt</option>
                        <option value="es-ES">Español</option>
                        <option value="fr-FR">Français</option>
                        <option value="de-DE">Deutsch</option>
                    </select>
                </label>
                <label class="language-field" for="userLanguage">
                    <span data-i18n="userLanguage">사용자 언어</span>
                    <select id="userLanguage">
                        <option value="ko-KR">한국어</option>
                        <option value="en-US">English</option>
                        <option value="ja-JP">日本語</option>
                        <option value="zh-CN">中文</option>
                        <option value="vi-VN">Tiếng Việt</option>
                        <option value="es-ES">Español</option>
                        <option value="fr-FR">Français</option>
                        <option value="de-DE">Deutsch</option>
                    </select>
                </label>
            </div>
            <div class="toolbar" role="group" aria-label="음성 인식 도구" data-i18n-aria="speechTools">
                <button id="start">
                    <span class="record-dot" aria-hidden="true"></span>
                    <span id="status" role="status">인식 시작</span>
                </button>
                <button id="stop" data-i18n="stop">인식 중지</button>
                <button id="clear" data-i18n="clear">초기화</button>
            </div>
            <h3 class="transcript-heading" data-i18n="transcript">스크립트</h3>
            <div id="transcript">
                <div id="final"></div>
                <div id="interim" aria-live="polite"></div>
            </div>
        </main>
        <aside class="explanation" id="explanation" aria-label="선택한 텍스트 설명" data-i18n-aria="explanation" hidden>
            <div class="explanation-header">
                <h3 data-i18n="original">원어</h3>
                <button id="deleteExplanation" type="button" data-i18n="deleteCard">카드 삭제</button>
            </div>
            <p id="selectedTerm"></p>
            <div id="response" aria-live="polite" aria-atomic="true"></div>
        </aside>
    </body>
</html>
