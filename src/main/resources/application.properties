spring.application.name=natjang
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
openai.api-key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-6-luna}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/galpi}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:natjang}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
